<!doctype html><meta charset="utf-8"><style>
:root{--veil:#241C13;--inkPrimary:#FBF6EC;--inkSecondary:#E0B97E;--accent:#B9762E;--badgeInk:#17120E}*{margin:0;padding:0;box-sizing:border-box}
html,body{width:896px;height:504px;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif}
