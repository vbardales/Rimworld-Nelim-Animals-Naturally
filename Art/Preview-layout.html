:root{--veil:#241C13;--inkPrimary:#FBF6EC;--inkSecondary:#E0B97E;--accent:#B9762E;--badgeInk:#17120E;--iconOutline:var(--accent)}*{margin:0;padding:0;box-sizing:border-box}

@property --lueur{syntax:'<percentage>';inherits:false;initial-value:24%}
