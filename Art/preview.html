<!doctype html>
<meta charset="utf-8">
<title>Nelim's Animals, Naturally preview</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 896px; height: 504px; overflow: hidden; }
body { font-family: "Segoe UI", system-ui, sans-serif; }
.frame { position: relative; width: 896px; height: 504px;
  background: url('Preview-source.png') center/cover no-repeat; }
.veil { position: absolute; inset: 0;
  background: radial-gradient(ellipse 980px 760px at top left, rgba(var(--veil-rgb), .97) 0%, rgba(var(--veil-rgb), .95) 60%, rgba(var(--veil-rgb), 0) 100%); }
.text { position: absolute; left: 50px; top: 54px;
  color: var(--inkPrimary); text-shadow: 0 3px 10px rgba(0,0,0,.75); }
h1 { font-size: 44px; font-weight: 600; line-height: 1.1; letter-spacing: 0; }
h1 .suffix { font-size: .82em; color: var(--inkSecondary); }
.tag { margin-top: 8px; font-size: 22px; font-weight: 400; line-height: 1.1;
  letter-spacing: .2px; color: var(--inkSecondary); }
.rule { width: 58px; height: 3px; background: var(--accent); margin: 20px 0 16px; }
p { width: 460px; font-size: 20px; font-weight: 400; line-height: 1.45; letter-spacing: 0; }
.badge { position: absolute; right: 0; top: 0; width: 80px; height: 80px;
  clip-path: polygon(0 0,100% 0,100% 100%); background: var(--accent); }
.version { position: absolute; left: 869px; top: 27px;
  transform: translate(-50%,-50%) rotate(45deg); color: var(--badgeInk);
  font-size: 26px; font-weight: 700; line-height: 1; }
</style>
<div class="frame">
  <div class="veil"></div>
  <div class="text">
    <h1>Nelim's Animals,<br><span class="suffix">Naturally</span></h1>
    <div class="tag">Biology-based animal rebalancing</div>
    <div class="rule"></div>
    <p>Body size, lifespan, taming, and hybridisation derived from each species' real mass and taxonomy.</p>
  </div>
  <div class="badge"></div><div class="version"></div>
</div>
<script>
window.previewReady = (async () => {
  const palette = await (await fetch('preview-palette.json')).json();
  for (const [key,value] of Object.entries(palette)) document.documentElement.style.setProperty('--'+key,value);
  document.documentElement.style.setProperty('--veil-rgb', palette.veil.match(/[a-f\d]{2}/gi).map(v=>parseInt(v,16)).join(','));
  const xml = new DOMParser().parseFromString(await (await fetch('../Mod/About/About.xml')).text(),'application/xml');
  const versions = [...xml.querySelectorAll('supportedVersions > li')].map(e=>e.textContent.trim()).filter(v=>/^\d+(\.\d+)+$/.test(v));
  versions.sort((a,b)=>{const aa=a.split('.').map(Number),bb=b.split('.').map(Number); for(let i=0;i<Math.max(aa.length,bb.length);i++){const d=(bb[i]||0)-(aa[i]||0);if(d)return d;}return 0;});
  if (!versions.length) throw new Error('No declared stable version');
  document.querySelector('.version').textContent=versions[0];
  await document.fonts.ready;
  await Promise.all([...document.images].map(i=>i.decode()));
  const bg = new Image(); bg.src='Preview-source.png'; await bg.decode();
})();
</script>
